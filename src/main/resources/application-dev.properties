# ==========================================
# PERFIL DEV - CONEXÃO COM POSTGRESQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_acoes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# (Garante que nenhuma configuração fantasma de ddl-auto tente sobrescrever o YML)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Dados de demonstração só são carregados quando este contexto é explicitamente ativado.
spring.liquibase.contexts=demo

app.market-data.brapi.token=${BRAPI_TOKEN}
app.market-data.twelve-data.apikey=${TWELVE_DATA_API_KEY}

# Frontend Vite local; pode ser sobrescrito por uma lista separada por virgulas.
app.http.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Bootstrap opcional do administrador inicial, exclusivo do profile dev.
# APP_ADMIN_USERNAME representa o e-mail usado para autenticação.
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
